<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Keygen Nota Service HP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #eaeaea;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 14px;
    }
    h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 13px; opacity: 0.7; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:active { transform: scale(0.98); }
    .btn-gen {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-bottom: 12px;
    }
    .btn-copy {
      background: rgba(76, 175, 80, 0.25);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.4);
      display: none;
    }
    .result {
      display: none;
      margin: 18px 0 12px;
      padding: 16px;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.35);
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      word-break: break-all;
      color: #a5d6a7;
    }
    .warn {
      margin-top: 20px;
      padding: 12px;
      background: rgba(244, 67, 54, 0.12);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      color: #ef9a9a;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔑</div>
    <h1>Keygen Nota Service HP</h1>
    <p class="sub">Developer tool — generate kode aktivasi</p>

    <label>Serial Number (SN) pelanggan</label>
    <input type="text" id="sn" placeholder="NSHP-XXXXXXXX" autocomplete="off" autocapitalize="characters">

    <button class="btn-gen" onclick="generate()">Generate Kode Aktivasi</button>

    <div id="out" class="result"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyCode()">📋 Salin Kode</button>

    <div class="warn">
      ⚠️ Hanya untuk developer. Jangan bagikan APK keygen ke pelanggan.
      SECRET harus sama dengan yang ada di aplikasi utama.
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.bundle.js"></script>
</body>
</html>
